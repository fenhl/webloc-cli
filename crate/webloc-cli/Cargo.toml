[package]
name = "webloc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "webloc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"
plist = "1"
thiserror = "2"
url = "2"
webloc = { path = "../webloc" }
wheel = { git = "https://github.com/fenhl/wheel", default-features = false }
