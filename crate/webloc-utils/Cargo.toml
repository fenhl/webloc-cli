[package]
name = "webloc-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "webloc-release"
path = "src/release.rs"

[dependencies]
async-trait = "0.1"
itertools = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "hickory-dns", "http2", "json", "query", "rustls-no-provider", "system-proxy", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process"] }
webloc = { path = "../webloc" }
wheel = { git = "https://github.com/fenhl/wheel" }
